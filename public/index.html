<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KOSPI / Nasdaq Market Map</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"></span>
        <div>
          <h1>한국 / 미국 주식 마켓맵</h1>
          <p id="refreshLabel">시장 상태 확인 중</p>
        </div>
      </div>
      <div class="indices" aria-label="주요 지수">
        <div class="index-card" id="kospiIndex">
          <span class="index-name">KOSPI</span>
          <strong>--</strong>
          <span class="index-change">--</span>
        </div>
        <div class="index-card" id="kosdaqIndex">
          <span class="index-name">KOSDAQ</span>
          <strong>--</strong>
          <span class="index-change">--</span>
        </div>
        <div class="index-card" id="usdKrwIndex">
          <span class="index-name">USD/KRW</span>
          <strong>--</strong>
          <span class="index-change">--</span>
        </div>
        <div class="index-card" id="nasdaqIndex">
          <span class="index-name">Nasdaq</span>
          <strong>--</strong>
          <span class="index-change">--</span>
        </div>
        <div class="index-card" id="topSp500Index">
          <span class="index-name">S&P 500</span>
          <strong>--</strong>
          <span class="index-change">--</span>
        </div>
      </div>
    </header>

    <main class="dashboard">
      <section class="panel panel-korea">
        <div class="panel-head">
          <div>
            <h2 id="koreaTitle">KOSPI</h2>
            <p id="koreaSubtitle">한국경제 KOSPI 1일 맵</p>
          </div>
          <div class="panel-actions">
            <div class="segmented" aria-label="한국 시장 선택">
              <button class="segment active" type="button" data-market="KOSPI">KOSPI</button>
              <button class="segment" type="button" data-market="KOSDAQ">KOSDAQ</button>
              <button class="segment" type="button" data-market="KRX300">KRX300</button>
            </div>
            <button class="back-button" id="sectorBack" type="button" hidden>전체</button>
            <button class="refresh-button" id="refreshKorea" type="button" title="새로고침" aria-label="한국 맵 새로고침">새로고침</button>
          </div>
        </div>
        <div class="period-bar" aria-label="한국 맵 조회기간">
          <button class="period active" type="button" data-term="1day">1일</button>
          <button class="period" type="button" data-term="1week">일주일</button>
          <button class="period" type="button" data-term="1month">한 달</button>
          <button class="period" type="button" data-term="3months">세 달</button>
          <button class="period" type="button" data-term="6months">여섯 달</button>
          <button class="period" type="button" data-term="1year">일 년</button>
          <button class="period" type="button" data-term="ytd">연초</button>
        </div>
        <div class="map-frame">
          <div id="koreaMap" class="treemap" role="application" aria-label="KOSPI 종목 마켓맵"></div>
          <div id="koreaLoading" class="loading">KOSPI 맵을 불러오는 중</div>
        </div>
      </section>

      <section class="panel panel-us">
        <div class="panel-head">
          <div>
            <h2 id="usTitle">US Stocks</h2>
            <p id="usSubtitle">미국 주식 1일 맵</p>
          </div>
          <div class="panel-actions">
            <button class="back-button" id="usSectorBack" type="button" hidden>전체</button>
            <button class="refresh-button" id="refreshUs" type="button" title="새로고침" aria-label="미국 맵 새로고침">새로고침</button>
          </div>
        </div>
        <div class="map-frame">
          <div id="usMap" class="treemap" role="application" aria-label="미국 주식 마켓맵"></div>
          <div id="usLoading" class="loading">미국 주식 맵을 불러오는 중</div>
        </div>
      </section>
    </main>

    <div class="modal-backdrop" id="modalBackdrop" hidden>
      <article class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="modal-close" id="modalClose" type="button" aria-label="닫기">×</button>
        <div id="modalBody"></div>
      </article>
    </div>

    <script src="/app.js?v=kosdaq-sectors-refresh-20260822"></script>
  </body>
</html>
